<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background-image: url("photo_5911365100004643112_y.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: Arial, sans-serif;
        }

        .Login-box {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
          
        }

        .box {
            width: 330px;
            padding: 65px 28px 45px;
              border-radius: 5px;
            background-color: rgba(255, 255, 255, 0.4);
        }

        h2 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 24px;
            color: black;
        }

        form input[type="text"],
        form input[type="password"] {
            width: 100%;
            height: 43px;
            padding: 10px 6px;
            margin-bottom: 10px;
            border: none;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.65);
            outline: none;
        }

        button {
            width: 100%;
            height: 44px;
            background: #005f00;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #004d00;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 7px;
            font-size: 13px;
        }

        .options label {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .options a {
            color: blue;
        }

        @media (max-width: 400px) {
            .box {
                width: 90%;
            }
        }
    </style>
</head>

<body>
    <div class="Login-box">
        <div class="box">
            <h2>Account Login</h2>

            <form>
                <input type="text" placeholder="user name">
                <input type="password" placeholder="password">

                <button type="submit">LOGIN</button>

                <div class="options">
                    <label>
                        <input type="checkbox">
                        remember me
                    </label>

                    <a href="#">Forgot Password?</a>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
